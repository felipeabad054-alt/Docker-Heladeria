services:
  backend:
    image: felipeabad/heladeria-backend:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: ${RDS_HOST}
      DB_PORT: ${RDS_PORT:-5432}
      DB_NAME: ${RDS_DATABASE:-heladeria}
      DB_USER: ${RDS_USER}
      DB_PASSWORD: ${RDS_PASSWORD}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_CA: /app/certs/global-bundle.pem
      PORT: 5000
    volumes:
      - /home/ubuntu/global-bundle.pem:/app/certs/global-bundle.pem:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: felipeabad/heladeria-frontend:${IMAGE_TAG:-latest}
    environment:
      VITE_API_URL: http://${PUBLIC_HOST}:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped