services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-heladeria}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-heladeria}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12

    restart: unless-stopped

  backend:
    image: felipeabad/heladeria-backend:${IMAGE_TAG:-v1}

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-heladeria}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 5000

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    image: felipeabad/heladeria-frontend:${IMAGE_TAG:-v1}

    environment:
      VITE_API_URL: http://${PUBLIC_HOST}:5000/api

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  postgres_data: