services:
  postgres:
    image: postgres:17
    container_name: heladeria-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: heladeria
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heladeria"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: heladeria-backend:latest
    container_name: heladeria-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: heladeria
      DB_USER: postgres
      DB_PASSWORD: "12345"
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: heladeria-frontend:latest
    container_name: heladeria-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: